<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestión de Estudiantes | ITTG</title><link rel="icon" href="descarga.png"><link rel="stylesheet" href="styles.css"><script src="auth.js" defer></script><script src="students.js" defer></script></head><body><header class="site-header"><div class="header-top"><div class="brand"><img class="brand-logo" src="descarga.png" alt="Logotipo institucional"><div><p class="eyebrow">Administración</p><h1>Gestión de estudiantes</h1><p class="brand-subtitle">Prepara tus segmentos de difusión</p></div></div><div class="user-info"><button id="logoutButton" class="button-outline" type="button">Cerrar sesión</button></div></div><nav class="top-nav"><a href="index.html">Inicio</a><a href="notice_form.html">Redactar Aviso</a><a href="manage_notices.html">Gestión de Avisos</a><a class="active" href="students.html">Estudiantes</a></nav></header><main><div id="status" class="message" hidden></div><section class="panel"><h2>Agregar estudiante</h2><form id="studentForm" class="form-grid"><div><label for="name">Nombre completo</label><input id="name" name="name" type="text" placeholder="Ej. Juan Pérez" required></div><div><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="ejemplo@dominio.com" required></div><div><label for="carrera">Carrera</label><select id="carrera" required><option value="">Selecciona una carrera</option></select></div><div><label for="semestre">Semestre</label><select id="semestre" required><option value="">Selecciona un semestre</option></select></div><div><label for="grupo">Grupo</label><select id="grupo" required><option value="">Selecciona un grupo</option></select></div><div class="form-action"><button class="primary-button" type="submit">Agregar estudiante</button></div></form></section><section class="panel"><h2>Listado de estudiantes</h2><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Carrera</th><th>Semestre</th><th>Grupo</th></tr></thead><tbody id="studentsTable"><tr><td colspan="5">Cargando estudiantes...</td></tr></tbody></table></div></section><section class="panel"><h2>Resumen por segmento</h2><div class="table-wrap"><table><thead><tr><th>Carrera</th><th>Semestre</th><th>Grupo</th><th>Alumnos</th></tr></thead><tbody id="countsTable"><tr><td colspan="4">Cargando segmentos...</td></tr></tbody></table></div></section></main></body></html>
