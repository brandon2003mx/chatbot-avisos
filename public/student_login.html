<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ingreso Estudiante | ITTG</title><link rel="icon" href="descarga.png"><link rel="stylesheet" href="styles.css"><script src="auth.js" defer></script><script src="student_login.js" defer></script></head>
<body class="auth-page"><main class="auth-container"><section class="auth-card"><div class="auth-brand"><img src="descarga.png" alt="Logotipo del Instituto Tecnológico de Tuxtla Gutiérrez"><div><p class="eyebrow">Portal estudiantil</p><h1 id="formTitle">Ingreso Estudiante</h1><p id="formDescription">Consulta los avisos dirigidos a tu carrera y grupo.</p></div></div><div id="status" class="message" hidden></div><form id="studentForm"><div id="registrationFields" hidden><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" type="text" placeholder="Ej. Juan Pérez"><label for="carrera">Carrera</label><select id="carrera" name="carrera"><option value="">Selecciona tu carrera</option></select><label for="semestre">Semestre</label><select id="semestre" name="semestre"><option value="">Selecciona tu semestre</option></select><label for="grupo">Grupo</label><select id="grupo" name="grupo"><option value="">Selecciona tu grupo</option></select><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite tu contraseña"></div><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="tu.correo@ejemplo.com" required><label for="password">Contraseña</label><input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" required><button id="submitButton" class="primary-button" type="submit">Ingresar</button></form><p class="auth-link"><span id="toggleText">¿No tienes cuenta?</span> <a id="toggleMode" href="?register=true">Regístrate aquí</a></p><p class="auth-link"><a href="login.html">Soy coordinador</a></p></section></main></body></html>
